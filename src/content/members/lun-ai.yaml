description: I specialise in logical programming, which uses programs to reason about the world and derive
  verifiable hypotheses. My doctoral research used logic programming to facilitate human comprehension
  and human-AI partnership. My recent work developed a self-driving lab that combined logic programming
  and lab robots to automate gene function discovery in bacteria. My research was supported by the UKRI
  EPSRC Human-Like Computing network, EU Horizon 2020 research and innovation and the UKRI BBSRC AI-4-EB
  consortium.
research_interests: One overarching goal of AI research is to explore how artificial intelligence can
  assist scientific discovery. I focus on developing human-like AI systems that generate interpretable
  knowledge. I am interested in bridging existing biological knowledge with high-dimensional data by integrating
  logical reasoning, mechanistic modelling, and deep learning. I am also investigating how large language
  models can reason about complex biological questions, formulate plans for analysing multi-omics data,
  and propose testable, logic-driven hypotheses.
