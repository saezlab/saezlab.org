description: During my physics degree I have focused on molecular and medical imaging and have found a
  deep interest in both computational methods and biology. Working at the Heidelberg ion beam therapy
  centre (HIT) and being exposed to very hands-on medical applications of fundamental physical principles
  I have decided to pursue a medical degree starting in 2019. The pre-clinical years and my elective in
  digital medicine then drove me towards the topics of bioinformatics and molecular biology. I joined
  the Saez-Rodriguez group in 2024 for my medical doctoral degree (Dr. med.).
research_interests: Medical research is not exclusively conducted in the wet lab anymore. We create and
  analyse more data than ever, both from human tissue and animal models. My research will focus on single-cell
  transcriptomics in heart failure and the correlation of animal models to human samples.
