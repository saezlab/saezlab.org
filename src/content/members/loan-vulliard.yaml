description: My bioinformatics studies at INSA Lyon sparked my interest in computational approaches to
  study molecular biology. There, I had the opportunity to study for a semester at KAIST in South Korea.
  I also completed two research internships in cancer immunoinformatics, first with Prof. Colinge and
  Prof. Cornillot in Montpellier, then with Prof. Nielsen in Copenhagen. These experiences motivated me
  to join the PhD program at CeMM in Vienna in October 2017, and thegroup of Prof. Menche.After successfully
  defending my PhD in January 2023, I was awarded a postdoctoral fellowship from theAI Health Innovation
  Clusterto work together with Dr. Hartmann and Prof. Saez-Rodriguez in Heidelberg.Since 2021, I am also
  a board member of theCytoData society, with whom we strive to foster a research community dedicated
  to image-based profiling assays and their computational analyses. I also believe in the importance of
  scientific outreach and joined the organization team for the first editions of thePint of Science festivalin
  Austria.
research_interests: I am eager to reveal the quantitative principles underlying molecular biology and
  to better understand human health and diseases. For this, I use data analysis methods and collaborate
  with experimentalists and experts in the fields of immunology and cell biology.My undergraduate work
  focused on detecting and characterizing neoepitopes across cancer types, based on sequencing data.In
  my doctoral work, I studied cellular responses to chemical and genetic perturbations. I planned and
  coordinated imaging screens of combinations of CRISPR knockouts and drug treatments. I also established
  an image and data analysis pipeline to quantify morphologicalchanges in these experiments in order to
  create a map of how genes and drugs interact.My current aim is to develop and apply computational methods
  to profile and explain metabolic changes in multiplexed ion beam imaging experiments. I aim to contextualize
  and explain how spatial changes in the tumor immune microenvironment relate to disease stratification
  and therapeutic responses.
