description: Dzhevid Sali serves as a Project and Grants Manager, bringing a robust background in strategic
  program development and international collaboration. His experience includes significant roles such
  as a Project Officer at the European Molecular Biology Organization (EMBO), where he led a comprehensive
  evaluation of the Postdoctoral Fellowship Programme and presented key findings to international stakeholders.
  Earlier, as a Program Officer at the Roma Education Fund, he successfully managed an annual grants portfolio
  of 2-4 million EUR, overseeing the entire grant lifecycle, leading capacity-building initiatives, and
  contributing to organizational strategy. With master's degrees in Public Policy and Law, Dzhevid excels
  in strategic planning, stakeholder engagement, and project oversight. He is dedicated to driving impactful
  initiatives and ensuring robust administrative and grants management across diverse international research
  settings.
