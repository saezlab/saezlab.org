description: My expertise lies at the intersection of computational biology, molecular biology, and biomedicine.
  My work focuses on developing computational methods that integrate -omics data at multiple scales—bulk,
  single-cell, and spatial—to investigate how cells are organized within tissues and how this organization
  changes in disease. A key area of my research is performing meta-analyses of -omics studies from independent
  patient cohorts, which I believe strengthens the reliability of identifying molecular biomarkers.I began
  my academic career in the Saez-Rodriguez group in 2015 as a Bachelor intern, continuing my PhD studies
  within the same group. Currently, I am a Staff Scientist at EMBL-EBI, where I am expanding my research
  on gene regulatory mechanisms driving multicellular responses, with a growing emphasis on understanding
  host-microbiome interactions.
research_interests: I’m interested in understanding how the cells in our bodies work together to form
  tissues and how this organization changes during disease. By combining different types of data—such
  as bulk, single-cell, and spatial omics—I study how the structure of tissues impacts what individual
  cells do, and how individual cell behavior can affect the larger tissue. My goal is to understand how
  changes in one part of a tissue can influence the whole system. I believe that a multicellular functional
  perspective of single-cell data could promote the emergence of novel analysis strategies that could
  synergize the knowledge of the fields of mathematical physiology, ecology, and systems biology. I also
  explore whether different diseases or perturbations lead to similar changes in tissues, which helps
  us better understand how cells respond to stress or damage. For the same reason, I have also focused
  on systemic meta-analyses of distinct patient cohorts and etiologies to provide consensus transcriptional
  signatures that serve as references for future studies.
