description: I have always liked biology and medicine, so studying biochemistry for my undergrad was a
  good decision. My journey of liking computers so much started when I went to the CRUK-CI for a wet lab
  summer internship. I saw two interns next to me working on a super cool-looking computer screen. Since
  then, I have pursued computational knowledge constantly. During my master’s in Berlin, I again had both
  wet lab and dry lab experience, and realised that I am very passionate about computers (thank you Vim).
  During my master’s thesis at Stefanie Großwendt’s lab, I also realised that I am super interested in
  the topic of cell-cell communication, and in databases with biological prior knowledge. Therefore (and
  especially thanks to all my previous supervisors, colleagues, family and friends) I have decided to
  pursue academia further, joining the Saez-Rodriguez lab as a PhD student.
research_interests: With the existing and upcoming omics technologies, it could be possible to get deep
  insights into a cell’s way of working. I am super interested in how cells communicate/interact with
  each other, and how this knowledge could help us find therapeutic strategies for cancer and other diseases.
  During my PhD I am going to be part of theDECIDER project(European Union-funded project, grant agreement
  No 965193). Ultimately, my aim is to better understand the biology of cancer, to hopefully help patients
  down the line!
