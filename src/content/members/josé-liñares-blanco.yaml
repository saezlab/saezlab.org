description: I have a multidisciplinary background in Molecular Biology (BSc), Bioinformatics (MSc) and
  Computer Science (PhD).During my PhD stage (2017-2021) at University of A Coruña I have applied Machine
  Learning based techniques for the analysis of omics data in large cohorts of cancer patients for the
  search of new diagnostic and treatment strategies. During this period, I also collaborated through research
  internships with the Wellcome-Wolfson Institute for Experimental Medicine (Queen’s University Belfast)
  and with the Cancer Computational Biology Group at Vall D’Hebron Institute of Oncology.In 2022 I moved
  to University of Granada (GENyO) as postdoc to apply Machine Learning techniques in the field of precision
  medicine in autoimmune diseases.In 2023, I started as a Margarita Salas research fellow at Institute
  of Computational Biomedicine of University of Heidelberg under the supervision of Julio Saez-Rodriguez.
research_interests: My current interests are focused on the development and application of new statistical,
  computational and Machine Learning methods capable of analyzing in an integrated manner clinical and
  multi-omics data.
