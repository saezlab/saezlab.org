description: >-
  I started with a Bachelor’s in Applied Mathematics. Then, I took quite seriously the childhood advice
  that ‘math is important for life’ and signed up for a Master’s in Bioinformatics. I also finished a
  Master’s in Big Data Analytics. All these choices make me a person with a mixed but strongly
  computational background.

  During my PhD at the Wroclaw University of Science and Technology, I worked on host-microbiome
  interactions in neurodegeneration. I was specifically interested in the aggregation properties of
  bacterial proteins in our microbiome proteome and how they may influence Parkinson’s and Alzheimer’s
  diseases. Later, I worked for a year at the Sano Centre for Computational Medicine in Cracow (an
  institute funded by the European Union's Horizon 2020 program), studying antimicrobial resistance
  and bacterial protein secretion.

  I joined Saez lab in 2026 as a postdoctoral fellow. Now, I focus on analysis of multi-omics and
  microbiome data to decipher host-microbiome interactions in intestinal diseases. This is part of the
  CartoHostBug ERC grant.
research_interests: >-
  The complexity of life fascinates me. I’m particularly interested in how we can use large-scale data
  and advanced computational methods to understand the biology of human and bacterial cells, and
  their interactions.
