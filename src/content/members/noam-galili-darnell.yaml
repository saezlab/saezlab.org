description: 'I studied computational biology at the Weizmann Institute of Science, where I completed
  my MSc and PhD at the department of Molecular Cell Biology. My PhD research focused on developing computational
  approaches to study the spatial organization of glioma tumors.

  I joined the Saez Lab in June 2025 as a postdoctoral fellow, jointly with Sarah Teichmann Lab at Univeristy
  of Cambridge, as part of the EIPOD fellowship.'
research_interests: My current research focuses on the study of organzational dynamics in the thymus,
  utalizing single-cell and spatial transcriptomics data.
