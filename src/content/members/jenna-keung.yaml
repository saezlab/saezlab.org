description: I started with a biology background that focuses on cell biology and genetics. After working
  on a statistical genetics project during my undergraduate degree, I realised that I wanted to work in
  bioinformatics and learn more about computational biology. Afterwards, I had the opportunity to work
  on single-cell and bulk transcriptomics, as well as proteomics and metabolomics, in the context of different
  conditions such as cancer, and investigating immunological inter-pathways associations in COVID-19.
  Learning more about individual omics types led to an interest in multi-omics integration and methods
  development.
research_interests: I’m interested in multi-omics integration methods to combine information from different
  biological data types, in particular single-cell and spatial technologies. My current research project
  is focused on understanding the interaction of different cell types during disease progression of IgA
  nephropathy, a chronic kidney disease. I aim to achieve a more comprehensive understanding of underlying
  disease mechanisms by analysing different omics across multiple cohorts.
