description: Paul is a bioinformatician and software engineer with a keen interest in longevity research.
  Starting his academic journey in Biochemistry, he earned an MPhil in Bioinformatics, where he leveraged
  graph theory and GPU computing to process large-scale biological datasets. Noticing a gap in coding
  practices within academia,Paulpivoted to industry, where he built expertise as a full-stack software
  engineer. He played a key role in developing a construction supervision system, gaining comprehensive
  experience in front-end and back-end development, infrastructure management, and server scaling.
research_interests: Paul‘s ultimate research goal is to extend human lifespan. He is particularly interested
  in leveraging knowledge graphs and biological networks to enable AI-driven automated research cycles,
  with the aim of advancing systems biology and pharmaceutical research, ultimately uncovering the mechanisms
  of ageing.
