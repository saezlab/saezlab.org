description: After obtaining my BSc in Biotechnology at the Universitat of Girona, I​​ acquired a MSc
  in Mathematical modeling for Science and Engineering at the Universitat Autònoma de Barcelona. During
  those years I closely worked with Prof. Dr. Garcia-Ojalv​​o in the mathematical modeling of complex
  biological systems.Then I moved to Germany, where I started my PhD in Computational Biomedicine at the​​
  Ruprecht-Karls-Universität Heidelberg, led by Prof. Dr. Saez-Rodriguez, where I developed extensive
  data analysis skills. After graduating, I worked as a postdoctoral researcher at EMBL and DKFZ for Prof.
  Dr. Krijgsveld, where I analyzed complex mass spectrometry proteomic data sets. Currently I am working
  as a Bioinformatician at the Institute of Computational Biomedicine at the Universitätsklinikum Heidelberg.
research_interests: I am mainly interested in the description and understanding of complex biological
  systems from a physical/mathematical point of view. I am passionate about programming and the development
  of bioinformatic tools and resources that can be useful for the scientific community and the research
  and development of new biological and medical insights.
