description: 'I did my bachelor’s degree in Biology at the Universidad de Guadalajara in Mexico. Back
  then I had joined a couple of wet-lab groups focused on molecular biology and immunology. After having
  the opportunity to do research in Germany, I started my M.Sc degree in Molecular Bioscience at Heidelberg
  University. While exploring my interests, at first, I carried out internships which had both wet-lab
  and dry-lab components, but then I fully transitioned to bioinformatics. The projects included high-throughput
  screens of regulatory sequences, tool development in the context of a TCR-epitope deconvolution platform
  for autoimmune diseases, and studying gene regulatory networks in the immune system using a multi-omics
  cell atlas. During this time, my interest on two areas only grew: i) the immune system and its impact
  on disease mechanisms, and ii) tool development and data analysis to better understand biology. I will
  focus on both of these areas during my PhD at the Saez-Rodriguez group. I will explore IgA nephropathy
  by analyzing multi-omics datasets and will also dedicate my time to the prior-knowledge tools developed
  by the group.'
research_interests: I am very excited about the ever expanding reach of bioinformatics and multi-omics
  datasets, and the opportunity that this brings to better understand disease mechanisms. My interest
  lies at this intersection. Particularly, I am fascinated about the immune system and its involvement
  in an array of diseases, including cancer and autoimmune disorders. On the bioinformatics side, I enjoy
  exploring multi-layered datasets and piecing together the clues from the biology that lies behind.
