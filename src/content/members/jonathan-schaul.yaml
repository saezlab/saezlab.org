description: A computational bioinformatician with a unique interdisciplinary background spanning clinical
  practice, biomedical sciences, and data science. Beginning my career as a paramedic in Germany's emergency
  medical services, I developed a deep appreciation for patient care and healthcare challenges. This experience
  motivated me to pursue formal education in biomedical sciences at Maastricht University, where I discovered
  my passion for data-driven approaches to medical research. After completing my Master's in Data Science
  and gaining industry experience through an internship at Grünenthal Group, I pursued doctoral research
  at REPO4EU. Currently, I serve as a Staff Bioinformatician at the Institute for Computational Biomedicine
  at Universitätsklinikum Heidelberg, where I focus on enhancing access to prior knowledge, applying my
  skills in data engineering and web development in the Omnipath project.
research_interests: My research focuses on leveraging network medicine approaches to unravel the molecular
  complexity of rare diseases and cancer. I am particularly interested in developing and implementing
  FAIR (Findable, Accessible, Interoperable, and Reusable) data principles to enhance biomedical data
  sharing and integration. A key aspect of my work involves creating innovative web-based tools and platforms
  that make prior knowledge and computational analyses accessible to the broader biomedical research community.
  By combining network biology, data science, and web development, I aim to accelerate the translation
  of computational insights into clinical applications, ultimately improving diagnosis and treatment strategies
  for patients with rare diseases and cancer.
