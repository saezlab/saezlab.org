description: I graduated from Biochemistry by Universidad Autónoma de Madrid (UAM) in 2018, studying one
  semester at Boston University as a BU-UAM Science School scholar. As an undergrad, I performed wet and
  dry lab internships that applied omics technologies to detect rare mutations (Centro de Biologia Molecular
  Severo Ochoa, Spain) and to understand mouse limb development (Miguel Torres’ group at CNIC, Spain).
  During my Master’s and as a Fundación Margrit y Folke Pehrzon fellow, I left the wet lab to focus on
  the analysis of omics data with a systems biology perspective, first as a research intern at the clinical
  genetics laboratory (Karolinska Institutet, Sweden) and then at Erik Sonnhammer’s Systems Biology group
  (SciLifeLab, Sweden), where I used network modelling to quantify drug repurposing opportunities in over
  100 complex diseases, including COVID-19. After my Master’s I joined Miguel Torres’ and Fatima Sanchez-Cabo
  groups at CNIC funded by a “la Caixa” INPhINIT doctoral fellowship. As a PhD Student, I modelled the
  gene regulatory networks controlling cardiomyocyte proliferation in mouse and axolotl for the discovery
  of new therapeutic targets to induce heart regeneration. My PhD project included a research stay in
  Elly Tanaka’s group at IMBA (Austria) and was part of the REANIMA Project funded by Horizon2020.In January
  2025, I joined Saez Lab as a postdoc to work on the integration of bulk and single-cell omics data to
  identify key molecular circuits and therapeutic interventions to fight cardiac disease.
research_interests: I’m fascinated by the complexity of living systems and how life not only is a sum
  of its parts, but also determined by the interactions between its components. Therefore, in my research
  I take a systems biology approach by integrating different flavours of multi-omics data with prior knowledge
  to build models that reflect the composition and interactions that make complex systems. I use these
  models to simulate how changes in gene function affect the system as a whole and to predict new therapeutic
  avenues. From a biomedical point of view, I am curious about what mechanisms trigger acute and chronic
  heart disease and, through collaboration with experimentalists, I aim to identify actionable targets
  that can derive in novel, more efficient and safer therapies.
