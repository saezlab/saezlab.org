description: Louisa Gerhardt studied medicine at the University of Freiburg and completed her MD thesis
  on repair mechanisms following myocardial infarction at the Center of Systems Biology (MGH, HMS) in
  Boston. She started her medical training in Internal medicine in Switzerland and was awarded a research
  fellowship from the German Research Foundation in 2020 to study kidney repair mechanisms in the laboratory
  of Andrew McMahon at the University of Southern California, Los Angeles. During her postdoctoral studies
  she combined single cell omics and spatial transcriptomics with lineage tracing approaches to enhance
  our understanding of adaptive and maladaptive repair following acute kidney injury. In 2022 Louisa Gerhardt
  relocated to the University Hospital Mannheim and the University of Heidelberg, where she continues
  her training as a clinician-scientist in Internal medicine and Nephrology, supported by a clinician-scientist
  fellowship of the German Society of Internal Medicine. Both as physician and as scientist she strives
  to improve care for patients with kidney disease.
research_interests: My research focuses on understanding the molecular and cellular mechanisms of acute
  and chronic kidney diseases as well as their prognostic impact in the clinical context. In collaboration
  with the Saez-Rodriguez group, I employ spatial transcriptomics to unravel pathophysiologic processes
  in kidney disease.
